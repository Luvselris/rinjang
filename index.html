<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <title>rinjang</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --soft-green-bg: #e6f0e1;
      --soft-white-green: #f7fbf5;
      --inner-green: #edf5ea;
      --border-soft-green: #cfe0c7;
      --accent-soft-green: #b8d3ae;
      --star-active: #89b37c;
      --star-empty: #dcead6;
      --ink-main: #314a39;
      --ink-muted: #627a69;
      --ink-soft-black: #5c635e;
      --shadow-soft: 0 8px 24px rgba(105, 138, 108, 0.12);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--soft-green-bg);
      color: var(--ink-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 16px 14px 56px;
    }

    .nav-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      background-color: var(--soft-white-green);
      border: 1.5px solid var(--border-soft-green);
      border-radius: 22px;
      padding: 5px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 16px;
    }

    .nav-tab {
      padding: 7px 2px;
      border: none;
      border-radius: 15px;
      background-color: transparent;
      color: var(--ink-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .nav-tab.active {
      background-color: var(--accent-soft-green);
      color: var(--ink-main);
      font-weight: 700;
    }

    .page-panel {
      display: none;
    }

    .page-panel.active {
      display: block;
    }

    .card {
      background-color: var(--soft-white-green);
      border: 1.5px solid var(--border-soft-green);
      border-radius: 24px;
      padding: 16px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 14px;
    }

    .home-profile-card {
      text-align: center;
      padding-bottom: 22px;
    }

    .banner-img {
      width: 100%;
      height: 138px;
      object-fit: cover;
      border-radius: 18px;
      display: block;
      margin-bottom: -44px;
      border: 2px solid var(--soft-white-green);
      background-color: var(--inner-green);
    }

    .avatar-img {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 3.5px solid var(--soft-white-green);
      background-color: var(--inner-green);
      position: relative;
      z-index: 2;
      box-shadow: var(--shadow-soft);
    }

    .shop-title {
      font-size: 21px;
      font-weight: 700;
      color: var(--ink-main);
      margin-top: 10px;
    }

    .shop-desc {
      font-size: 13.5px;
      color: var(--ink-muted);
      margin-top: 8px;
      line-height: 1.65;
      white-space: pre-line;
      display: none;
    }

    .shop-desc.has-text {
      display: block;
    }

    .line-oa-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 13px 16px;
      border-radius: 18px;
      background-color: var(--inner-green);
      border: 1px solid var(--border-soft-green);
      text-decoration: none;
    }

    .line-oa-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink-main);
      text-align: left;
    }

    .line-oa-hint {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--ink-soft-black);
      text-align: right;
      flex-shrink: 0;
    }

    .section-heading {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink-main);
      margin-bottom: 8px;
      text-align: center;
    }

    .section-desc {
      font-size: 13.5px;
      color: var(--ink-muted);
      line-height: 1.65;
      white-space: pre-line;
      text-align: center;
      display: none;
    }

    .section-desc.has-text {
      display: block;
    }

    .review-summary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--inner-green);
      border: 1px solid var(--border-soft-green);
      border-radius: 16px;
      padding: 10px 12px;
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-main);
    }

    .review-form-box {
      background-color: var(--inner-green);
      border: 1px solid var(--border-soft-green);
      border-radius: 18px;
      padding: 12px;
      margin-top: 12px;
    }

    .star-picker {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .star-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border-soft-green);
      border-radius: 12px;
      background-color: var(--soft-white-green);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .star-btn.active {
      background-color: var(--accent-soft-green);
    }

    .star-svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .star-svg.filled {
      fill: var(--star-active);
      stroke: var(--ink-main);
      stroke-width: 1.4;
    }

    .star-svg.empty {
      fill: var(--star-empty);
      stroke: var(--ink-muted);
      stroke-width: 1.4;
    }

    .review-input, .review-textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border-soft-green);
      border-radius: 14px;
      font-size: 13px;
      background-color: #ffffff;
      color: var(--ink-main);
      outline: none;
      margin-bottom: 8px;
    }

    .review-submit-btn {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-soft-green);
      border-radius: 15px;
      background-color: var(--accent-soft-green);
      color: var(--ink-main);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .review-submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .reviews-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .review-item-card {
      background-color: var(--inner-green);
      border: 1px solid var(--border-soft-green);
      border-radius: 16px;
      padding: 12px;
    }

    .review-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .review-author {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink-main);
    }

    .review-stars-row {
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .review-comment {
      font-size: 13px;
      color: var(--ink-muted);
      line-height: 1.55;
      white-space: pre-line;
    }

    .posts-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
    }

    .post-box {
      width: 100%;
      max-width: 220px;
      background-color: var(--inner-green);
      border: 1px solid var(--border-soft-green);
      border-radius: 18px;
      padding: 10px;
    }

    .post-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .post-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink-main);
      margin-bottom: 2px;
    }

    .post-body {
      font-size: 12.5px;
      color: var(--ink-muted);
      line-height: 1.5;
      white-space: pre-line;
    }

    .post-link-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 12px;
      border-radius: 12px;
      background-color: var(--accent-soft-green);
      color: var(--ink-main);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
    }

    .links-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .item-link-btn {
      display: block;
      width: 100%;
      padding: 11px 14px;
      border-radius: 16px;
      background-color: var(--inner-green);
      border: 1px solid var(--border-soft-green);
      color: var(--ink-main);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 700;
      text-align: center;
    }

    .empty-state {
      text-align: center;
      font-size: 13px;
      color: var(--ink-muted);
      padding: 12px 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="nav-bar">
      <button type="button" class="nav-tab active" id="btn-home" onclick="switchTab('home')">home</button>
      <button type="button" class="nav-tab" id="btn-review" onclick="switchTab('review')">review</button>
      <button type="button" class="nav-tab" id="btn-game" onclick="switchTab('game')">game</button>
      <button type="button" class="nav-tab" id="btn-example" onclick="switchTab('example')">example</button>
      <button type="button" class="nav-tab" id="btn-detail" onclick="switchTab('detail')">detail</button>
    </div>

    <!-- หน้า home -->
    <div id="panel-home" class="page-panel active">
      <div class="card home-profile-card">
        <img id="homeBanner" class="banner-img" src="https://files.catbox.moe/2mv64c.jpeg" alt="rinjang banner">
        <img id="homeAvatar" class="avatar-img" src="https://files.catbox.moe/h8pid8.jpeg" alt="rinjang profile">
        <h1 id="homeShopName" class="shop-title">rinjang</h1>
        <p id="homeDesc" class="shop-desc"></p>
      </div>

      <div class="card">
        <a id="lineOaLink" href="https://lin.ee/6SC6aBD" target="_blank" rel="noopener noreferrer" class="line-oa-box">
          <span id="lineOaLabel" class="line-oa-label">line oa</span>
          <span class="line-oa-hint">click to chat</span>
        </a>
      </div>
    </div>

    <!-- หน้า review -->
    <div id="panel-review" class="page-panel">
      <div class="card">
        <h2 class="section-heading">review</h2>
        <p id="reviewDesc" class="section-desc"></p>

        <div class="review-summary" id="reviewSummary">ยังไม่มีรีวิว</div>

        <form class="review-form-box" onsubmit="submitCustomerReview(event)">
          <div class="star-picker" id="starPicker"></div>
          <input type="text" id="reviewerName" class="review-input" placeholder="ชื่อผู้รีวิว" maxlength="40" required>
          <textarea id="reviewerComment" class="review-textarea" rows="2" placeholder="พิมพ์ข้อความรีวิว..." maxlength="300" required></textarea>
          <button type="submit" id="reviewSubmitBtn" class="review-submit-btn">ส่งรีวิว</button>
        </form>

        <div id="reviewList" class="reviews-stack"></div>
      </div>
    </div>

    <!-- หน้า game -->
    <div id="panel-game" class="page-panel">
      <div class="card">
        <h2 class="section-heading">game</h2>
        <p id="gameDesc" class="section-desc"></p>
        <div id="gameLinks" class="links-stack"></div>
        <div id="gamePosts" class="posts-stack"></div>
        <div id="gameEmpty" class="empty-state"></div>
      </div>
    </div>

    <!-- หน้า example -->
    <div id="panel-example" class="page-panel">
      <div class="card">
        <h2 class="section-heading">example</h2>
        <p id="exampleDesc" class="section-desc"></p>
        <div id="exampleLinks" class="links-stack"></div>
        <div id="examplePosts" class="posts-stack"></div>
        <div id="exampleEmpty" class="empty-state"></div>
      </div>
    </div>

    <!-- หน้า detail -->
    <div id="panel-detail" class="page-panel">
      <div class="card">
        <h2 class="section-heading">detail</h2>
        <p id="detailDesc" class="section-desc"></p>
        <div id="detailLinks" class="links-stack"></div>
        <div id="detailPosts" class="posts-stack"></div>
        <div id="detailEmpty" class="empty-state"></div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const SITE_COLLECTION = "rinjang_site";
    const SITE_DOC = "main_config";

    const DEFAULT_BANNER = "https://files.catbox.moe/2mv64c.jpeg";
    const DEFAULT_AVATAR = "https://files.catbox.moe/h8pid8.jpeg";
    const DEFAULT_LINE_NAME = "line oa";
    const DEFAULT_LINE_URL = "https://lin.ee/6SC6aBD";

    let selectedRating = 5;
    let currentReviews = [];

    function createStarSvg(isFilled) {
      const cls = isFilled ? "star-svg filled" : "star-svg empty";
      return `
        <svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">
          <polygon points="12 2.5 14.95 8.48 21.55 9.44 16.77 14.1 17.9 20.67 12 17.57 6.1 20.67 7.23 14.1 2.45 9.44 9.05 8.48 12 2.5"></polygon>
        </svg>
      `;
    }

    function renderStarPicker() {
      const picker = document.getElementById("starPicker");
      let html = "";
      for (let i = 1; i <= 5; i++) {
        const activeClass = i <= selectedRating ? "star-btn active" : "star-btn";
        html += `<button type="button" class="${activeClass}" onclick="setRating(${i})" aria-label="${i} ดาว">${createStarSvg(i <= selectedRating)}</button>`;
      }
      picker.innerHTML = html;
    }

    function setRating(score) {
      selectedRating = score;
      renderStarPicker();
    }

    function renderReviewsSection(reviewData) {
      const rObj = reviewData || {};
      setOptionalText(document.getElementById("reviewDesc"), rObj.description || "");

      const list = Array.isArray(rObj.items) ? rObj.items : [];
      currentReviews = list;

      const summaryEl = document.getElementById("reviewSummary");
      const listEl = document.getElementById("reviewList");

      if (list.length === 0) {
        summaryEl.textContent = "ยังไม่มีรีวิว";
        listEl.innerHTML = `<div class="empty-state">เป็นคนแรกที่เขียนรีวิวได้เลย</div>`;
        return;
      }

      const sum = list.reduce((acc, item) => acc + (Number(item.rating) || 5), 0);
      const avg = (sum / list.length).toFixed(1);
      summaryEl.innerHTML = `${createStarSvg(true)} <span>${avg} / 5.0 (${list.length} รีวิว)</span>`;

      listEl.innerHTML = list.map(item => {
        const score = Math.max(1, Math.min(5, Number(item.rating) || 5));
        let starsHtml = "";
        for (let s = 1; s <= 5; s++) {
          starsHtml += createStarSvg(s <= score);
        }
        return `
          <div class="review-item-card">
            <div class="review-item-top">
              <span class="review-author">${escapeHtml(item.name || "ลูกค้า")}</span>
              <span class="review-stars-row">${starsHtml}</span>
            </div>
            <div class="review-comment">${escapeHtml(item.comment || "")}</div>
          </div>
        `;
      }).join("");
    }

    async function submitCustomerReview(e) {
      e.preventDefault();
      const nameInput = document.getElementById("reviewerName");
      const commentInput = document.getElementById("reviewerComment");
      const btn = document.getElementById("reviewSubmitBtn");

      const name = nameInput.value.trim();
      const comment = commentInput.value.trim();
      if (!name || !comment) return;

      btn.disabled = true;
      btn.textContent = "กำลังส่ง...";

      const newReview = {
        name,
        comment,
        rating: selectedRating,
        createdAt: Date.now()
      };

      const updatedItems = [newReview, ...currentReviews];

      try {
        await db.collection(SITE_COLLECTION).doc(SITE_DOC).set({
          review: {
            items: updatedItems
          }
        }, { merge: true });

        nameInput.value = "";
        commentInput.value = "";
        setRating(5);
      } catch (err) {
        alert("ส่งรีวิวไม่สำเร็จ กรุณาลองใหม่อีกครั้ง");
      } finally {
        btn.disabled = false;
        btn.textContent = "ส่งรีวิว";
      }
    }

    function switchTab(tabName) {
      ["home", "review", "game", "example", "detail"].forEach(name => {
        const btn = document.getElementById(`btn-${name}`);
        const panel = document.getElementById(`panel-${name}`);
        if (name === tabName) {
          btn.classList.add("active");
          panel.classList.add("active");
        } else {
          btn.classList.remove("active");
          panel.classList.remove("active");
        }
      });
    }

    function setOptionalText(el, text) {
      const clean = (typeof text === "string") ? text.trim() : "";
      el.textContent = clean;
      if (clean) {
        el.classList.add("has-text");
      } else {
        el.classList.remove("has-text");
      }
    }

    function renderSectionContent(prefix, sectionObj) {
      const sec = sectionObj || {};
      const descEl = document.getElementById(`${prefix}Desc`);
      const linksEl = document.getElementById(`${prefix}Links`);
      const postsEl = document.getElementById(`${prefix}Posts`);
      const emptyEl = document.getElementById(`${prefix}Empty`);

      const descText = (typeof sec.description === "string") ? sec.description.trim() : "";
      const linksList = Array.isArray(sec.links) ? sec.links.filter(item => item && (item.label || item.url)) : [];
      const postsList = Array.isArray(sec.posts)
        ? sec.posts.filter(item => item && (item.title || item.body || item.image || item.linkUrl))
        : [];

      setOptionalText(descEl, descText);

      linksEl.innerHTML = linksList.map(item => {
        const label = item.label || item.url;
        const href = item.url || "#";
        return `<a href="${escapeAttr(href)}" target="_blank" rel="noopener noreferrer" class="item-link-btn">${escapeHtml(label)}</a>`;
      }).join("");

      postsEl.innerHTML = postsList.map(post => {
        const imgHtml = post.image
          ? `<img src="${escapeAttr(post.image)}" alt="${escapeAttr(post.title || "post image")}" class="post-img">`
          : "";
        const titleHtml = post.title ? `<div class="post-title">${escapeHtml(post.title)}</div>` : "";
        const bodyHtml = post.body ? `<div class="post-body">${escapeHtml(post.body)}</div>` : "";
        const linkBtnHtml = post.linkUrl
          ? `<a href="${escapeAttr(post.linkUrl)}" target="_blank" rel="noopener noreferrer" class="post-link-btn">${escapeHtml(post.linkLabel || "เปิดลิงก์")}</a>`
          : "";
        return `<div class="post-box">${imgHtml}${titleHtml}${bodyHtml}${linkBtnHtml}</div>`;
      }).join("");

      if (!descText && linksList.length === 0 && postsList.length === 0) {
        emptyEl.textContent = "ยังไม่มีข้อมูล";
      } else {
        emptyEl.textContent = "";
      }
    }

    function applySiteData(raw) {
      const data = raw || {};
      document.getElementById("homeBanner").src = data.banner || DEFAULT_BANNER;
      document.getElementById("homeAvatar").src = data.profile || DEFAULT_AVATAR;
      document.getElementById("homeShopName").textContent = data.shopName || "rinjang";
      setOptionalText(document.getElementById("homeDesc"), data.homeDescription || "");

      const lineBtn = document.getElementById("lineOaLink");
      const lineLabel = document.getElementById("lineOaLabel");
      lineLabel.textContent = data.lineName || DEFAULT_LINE_NAME;
      lineBtn.href = data.lineUrl || DEFAULT_LINE_URL;

      renderReviewsSection(data.review);
      renderSectionContent("game", data.game);
      renderSectionContent("example", data.example);
      renderSectionContent("detail", data.detail);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function escapeAttr(str) {
      return String(str).replace(/"/g, "&quot;");
    }

    renderStarPicker();
    applySiteData({});

    db.collection(SITE_COLLECTION).doc(SITE_DOC).onSnapshot(doc => {
      if (doc.exists) {
        applySiteData(doc.data());
      }
    });
  </script>
</body>
</html>
